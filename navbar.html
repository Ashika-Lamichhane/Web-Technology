<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}


.navbar {
    display: flex; 
    justify-content: space-between;
    align-items: center;
    background-color: #333; 
    padding: 1rem 2rem; 
    color: white;
}


.logo {
    font-size: 1.5rem;
    font-weight: bold;
    cursor: pointer;
}


.nav-links {
    list-style: none; 
    display: flex; 
    gap: 20px; 
}


.nav-links a {
    text-decoration: none; 
    color: white;
    font-size: 1rem;
    transition: color 0.3s ease;
}


.nav-links a:hover {
    color: #ff9800; 
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyLogo</div>

        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div style="padding: 20px;">
        <h1>Welcome to my website</h1>
        <p>This is a sample page Navbar Design.</p>
    </div>


</body>
</html>
