<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
   <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

:root {
    --primary-color: #4CAF50; 
    --secondary-color: #388E3C; 
    --background-color: #f4f7f6;
    --card-background: #ffffff;
    --text-color: #333;
    --border-radius: 8px;
    --box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--background-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}



.registration-container {
    width: 100%;
    max-width: 450px;
    background: var(--card-background);
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow);
    padding: 40px;
}

.form-header {
    text-align: center;
    margin-bottom: 30px;
}

.form-header h2 {
    color: var(--primary-color);
    font-weight: 700;
    margin-bottom: 5px;
}

.form-header p {
    color: #777;
    font-size: 0.95rem;
}



.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;
    margin-bottom: 8px;
    color: var(--text-color);
    font-weight: 600;
    font-size: 0.9rem;
}

.registration-form input[type="text"],
.registration-form input[type="email"],
.registration-form input[type="tel"],
.registration-form input[type="date"],
.registration-form select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ddd;
    border-radius: var(--border-radius);
    font-size: 1rem;
    color: var(--text-color);
    transition: all 0.3s ease;
    -webkit-appearance: none; 
    -moz-appearance: none;
    appearance: none;
}

.registration-form input:focus,
.registration-form select:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
    outline: none;
}


.custom-select-wrapper {
    position: relative;
}


.custom-select-wrapper::after {
    content: '▼'; 
    position: absolute;
    top: 60%;
    right: 15px;
    transform: translateY(-50%);
    font-size: 0.75rem;
    color: #999;
    pointer-events: none; 
    transition: color 0.3s ease;
}

.registration-form select:focus + .custom-select-wrapper::after {
    color: var(--primary-color);
}

.registration-form select {
    background: var(--card-background);
}

.registration-form select option {
    padding: 10px;
}
.submit-btn {
    width: 100%;
    padding: 15px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: var(--border-radius);
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.1s ease;
    margin-top: 10px;
}

.submit-btn:hover {
    background-color: var(--secondary-color);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
}
.submit-btn:active {
    transform: translateY(0);
}
   </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="registration-container">
        <div class="form-header">
            <h2>Student Registration</h2>
            <p>Enroll today and start your journey!</p>
        </div>

        <form action="#" method="POST" class="registration-form">
            
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Ashika Lamichhane" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@school.edu" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
            </div>

            <div class="input-group custom-select-wrapper">
                <label for="course">Select Course</label>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Choose a Course</option>
                    <option value="CS">Computer Science</option>
                    <option value="EE">Electrical Engineering</option>
                    <option value="BBA">Business Administration</option>
                    <option value="ARTS">Liberal Arts</option>
                </select>
            </div>

            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>
            
            <button type="submit" class="submit-btn">Register Now</button>
        </form>
    </div>

</body>
</html>
